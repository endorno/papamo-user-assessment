name = "papamo-user-assessment"
main = "src/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "papamo-user-assessment"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SUPABASE_URL = "http://127.0.0.1:15421"
SUPABASE_JWT_ISSUER = "http://127.0.0.1:15421/auth/v1"
SUPABASE_JWT_AUDIENCE = "authenticated"
REPORT_GENERATOR = "rule_v1"
APP_ENV = "production"
NON_PRODUCTION_TOOLS_ENABLED = "false"
STAGING_ALLOWED_EMAILS = ""

[env.staging]
name = "papamo-user-assessment-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "papamo-user-assessment-staging"
# ステージング用 D1 を作成したあと、実際の ID に置き換える。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.staging.vars]
# ステージング専用 Supabase プロジェクトの値に置き換える。
SUPABASE_URL = "https://staging-project-ref.supabase.co"
SUPABASE_JWT_ISSUER = "https://staging-project-ref.supabase.co/auth/v1"
SUPABASE_JWT_AUDIENCE = "authenticated"
REPORT_GENERATOR = "rule_v1"
APP_ENV = "staging"
NON_PRODUCTION_TOOLS_ENABLED = "true"

[env.staging.secrets]
required = ["STAGING_ALLOWED_EMAILS"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
