name = "papamo-user-assessment"
main = "src/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "papamo-user-assessment"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 保護者向けレポートのPDFを Browser Run のヘッドレス Chrome で作る。
[browser]
binding = "BROWSER"

[vars]
SUPABASE_URL = "http://127.0.0.1:15421"
SUPABASE_JWT_ISSUER = "http://127.0.0.1:15421/auth/v1"
SUPABASE_JWT_AUDIENCE = "authenticated"
REPORT_GENERATOR = "rule_v1"
APP_ENV = "production"
NON_PRODUCTION_TOOLS_ENABLED = "false"

[env.staging]
name = "papamo-user-assessment-staging"
workers_dev = false
preview_urls = false

[[env.staging.routes]]
pattern = "user-assessment-staging.heyasupo-lab.com"
custom_domain = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "papamo-user-assessment-staging"
database_id = "66203a74-eac7-4267-b036-e9d298daea30"
migrations_dir = "migrations"

# バインディングは環境に継承されないため、staging にも書く。
[env.staging.browser]
binding = "BROWSER"

[env.staging.vars]
SUPABASE_URL = "https://rqrtabsygnlhgjlevqah.supabase.co"
SUPABASE_JWT_ISSUER = "https://rqrtabsygnlhgjlevqah.supabase.co/auth/v1"
SUPABASE_JWT_AUDIENCE = "authenticated"
REPORT_GENERATOR = "rule_v1"
APP_ENV = "staging"
NON_PRODUCTION_TOOLS_ENABLED = "true"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
