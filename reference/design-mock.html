<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>へやすぽ 育ちマップ｜コーチ画面プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B27; --ink2:#4A5C56; --mute:#7E8E88; --line:#D9E1DD; --line2:#EDF1EF;
  --paper:#F3F6F4; --card:#FFFFFF;
  --green:#2F7D6E; --green-soft:#E3F1EC; --green-ink:#1D5A4E;
  --orange:#D9803D; --orange-soft:#FBEEDF; --orange-ink:#8C4A14;
  --violet:#7C64AE; --violet-soft:#EEEAF7; --violet-ink:#4B3A74;
  --red:#C4534A; --red-soft:#FAE7E4;
  --r:10px; --r-lg:16px;
  font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.65}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[role=link]{cursor:pointer}
.crumb [role=link]{color:var(--green);font-weight:500;white-space:nowrap}
h1,h2,h3{margin:0;font-weight:700;line-height:1.35}
h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
.muted{color:var(--mute)}
.small{font-size:.85rem}
.hide{display:none!important}

/* ---------- app frame ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .in{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:inline-grid;place-items:center;color:#fff;font-size:.8rem}
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink2);flex:1;min-width:0}
.crumb .sep{color:var(--line);font-weight:400}
.crumb .cur{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.main{flex:1;max-width:1080px;width:100%;margin:0 auto;padding:28px 20px 80px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:10px 16px;font-weight:500;min-height:44px;transition:background .15s}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-size:1.05rem;padding:12px 22px}
.btn.primary:hover{background:var(--green-ink)}
.btn.big{min-height:56px;font-size:1.1rem;padding:14px 28px;border-radius:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--green);font-weight:700}
.btn.ghost:hover{background:var(--green-soft)}
.btn.danger-ghost{border-color:transparent;background:transparent;color:var(--red)}
.btn:focus-visible,.lv-item:focus-visible,.card-link:focus-visible{outline:3px solid #9CCFC2;outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 32px}
.login-card .brand{font-size:1.25rem;margin-bottom:6px}
.login-card .mark{width:36px;height:36px;border-radius:11px;font-size:1rem}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field label{font-size:.9rem;font-weight:500;color:var(--ink2)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:#fff;min-height:46px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #9CCFC2;border-color:var(--green)}
.notice{margin-top:22px;padding:12px 14px;border-radius:var(--r);background:var(--paper);font-size:.82rem;color:var(--ink2);line-height:1.6}

/* ---------- home ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{color:var(--mute);margin-top:4px}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;color:var(--ink2);font-size:.95rem;font-weight:700}
.section-title .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--line2);color:var(--ink2);font-size:.8rem;padding:0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card-link{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 16px;transition:border-color .15s,transform .15s}
.card-link:hover{border-color:var(--green)}
.card-link.urgent{border-left:5px solid var(--orange)}
.card-link.draft{border-left:5px solid var(--violet)}
.card-link.first{border-left:5px solid var(--line)}
.kid{display:flex;align-items:center;gap:12px}
.kid .face{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;flex:none}
.kid .name{font-size:1.2rem;font-weight:700}
.kid .meta{color:var(--mute);font-size:.85rem}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.status.orange{background:var(--orange-soft);color:var(--orange-ink)}
.status.violet{background:var(--violet-soft);color:var(--violet-ink)}
.status.green{background:var(--green-soft);color:var(--green-ink)}
.status.gray{background:var(--line2);color:var(--ink2)}
.lvchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;min-height:30px;align-items:center}
.lvchip{background:var(--green-soft);color:var(--green-ink);border-radius:8px;padding:3px 9px;font-size:.85rem;font-weight:700}
.lvchip.todo{background:var(--violet-soft);color:var(--violet-ink);font-weight:500}
.lvchip.lock{background:var(--line2);color:var(--mute);font-weight:500}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.85rem;color:var(--ink2)}
.card-foot .cta{color:var(--green);font-weight:700}

/* ---------- child hub ---------- */
.hub-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.hub-head .kid .face{width:58px;height:58px;font-size:1.4rem}
.hub-head .kid .name{font-size:1.6rem}
.goals{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.goals span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel + .panel{margin-top:18px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.panel-h h2{font-size:1.05rem}
.panel-h .r{font-size:.82rem;color:var(--mute)}
.map{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center}
@media(max-width:560px){.map{grid-template-columns:1fr}}
.lvrows{display:flex;flex-direction:column;gap:9px}
.lvrow{display:grid;grid-template-columns:118px 1fr 78px;gap:10px;align-items:center;font-size:.9rem}
.lvrow .nm{font-weight:500;line-height:1.3}
.lvrow .nm small{display:block;color:var(--mute);font-weight:400;font-size:.75rem}
.track{height:14px;background:var(--line2);border-radius:7px;position:relative;overflow:hidden}
.track .prev{position:absolute;left:0;top:0;bottom:0;background:#B9D8CF;border-radius:7px}
.track .cur{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:7px}
.track .cur.dn{background:var(--orange)}
.track.locked{background:repeating-linear-gradient(135deg,var(--line2) 0 5px,#fff 5px 10px)}
.lvval{text-align:right;font-weight:700;font-size:1.05rem;white-space:nowrap}
.lvval .d{font-size:.8rem;margin-left:4px;font-weight:700}
.d.up{color:var(--green)}.d.dn{color:var(--orange)}.d.eq{color:var(--mute)}
.lvrow.locked{color:var(--mute)}
.lvrow.locked .lvval{font-size:.75rem;font-weight:500;color:var(--violet-ink)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* strategy */
.strategy .theme{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.strategy .theme:first-of-type{border-top:0;padding-top:4px}
.strategy .num{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:.95rem}
.strategy .num.two{background:#5CA394}.strategy .num.three{background:#93C3B7;color:var(--green-ink)}
.strategy .ttl{font-weight:700}
.strategy .next{font-size:.85rem;color:var(--ink2);margin-top:2px}
.strategy .next b{color:var(--green-ink)}
.watch{margin-top:8px;font-size:.82rem;color:var(--ink2);background:var(--paper);border-radius:8px;padding:8px 10px}
.watch b{color:var(--orange-ink)}
.plan-box{margin-top:14px;padding:14px;border-radius:12px;background:var(--green-soft);color:var(--green-ink)}
.plan-box .t{font-weight:700}
.plan-box ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}

/* troubles + ppi */
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:.92rem;align-items:center}
.kv .v{font-weight:700;font-size:1.15rem;text-align:right}
.bar-ppi{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ppi{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:10px;font-size:.85rem}
.ppi .dots{display:flex;gap:4px}
.ppi .dots i{width:16px;height:10px;border-radius:3px;background:var(--line2)}
.ppi .dots i.on{background:var(--orange)}
.ppi .dots i.was{background:#F1CDAE}
.ppi .n{text-align:right;font-weight:700}

/* timeline */
.tl{position:relative;margin:22px 8px 6px;height:70px}
.tl .line{position:absolute;left:0;right:0;top:20px;height:3px;background:var(--line)}
.tl .span{position:absolute;top:16px;height:11px;border-radius:6px;background:var(--green-soft);border:1px solid #B9D8CF}
.tl .pt{position:absolute;top:12px;transform:translateX(-50%);text-align:center;font-size:.78rem;color:var(--ink2);width:110px}
.tl .pt i{display:block;width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 0 0 1px var(--green);margin:0 auto 6px}
.tl .pt.future i{background:#fff;border:3px dashed var(--mute);box-shadow:none}
.tl .pt.draft i{background:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.tl .pt b{display:block;color:var(--ink)}
.tl .pt [role=link]{color:var(--green);font-weight:700}
.unlock-note{margin-top:14px;padding:12px 14px;border:1px dashed #C4B7E6;background:var(--violet-soft);border-radius:12px;color:var(--violet-ink);font-size:.88rem}
.unlock-note b{display:block;margin-bottom:2px}

/* ---------- wizard ---------- */
.wiz{max-width:760px;margin:0 auto}
.steps{display:flex;gap:6px;margin-bottom:18px;align-items:center}
.steps .s{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps .s.done{background:var(--green)}
.steps .s.cur{background:var(--green);outline:3px solid #B9D8CF}
.steps .s.lock{background:repeating-linear-gradient(90deg,var(--line) 0 4px,#fff 4px 8px)}
.wiz-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.wiz-head .stepno{color:var(--mute);font-size:.85rem}
.autosave{font-size:.8rem;color:var(--green-ink);display:inline-flex;align-items:center;gap:6px}
.autosave i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.wiz .panel{padding:24px}
.wiz h1{font-size:1.4rem}
.hint{color:var(--ink2);margin-top:6px}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.check + .check{margin-top:8px}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--green);flex:none}
.check .t{font-weight:500}
.check .s{font-size:.82rem;color:var(--mute)}
.check.on{border-color:var(--green);background:var(--green-soft)}
.check.violet{border-style:dashed;border-color:#C4B7E6}
.exlabel{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.exlabel .ic{width:44px;height:44px;border-radius:12px;background:var(--green-soft);display:grid;place-items:center;font-size:1.4rem}
.lv-list{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:460px;overflow:auto;padding-right:4px;border:1px solid var(--line);border-radius:12px;padding:8px}
.band-h{font-size:.78rem;color:var(--mute);padding:10px 8px 4px;font-weight:700}
.lv-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:1px solid transparent;background:#fff;border-radius:10px;padding:9px 10px;text-align:left;width:100%}
.lv-item:hover{background:var(--paper)}
.lv-item.sel{background:var(--green-soft);border-color:var(--green)}
.lv-item .no{font-weight:700;color:var(--green-ink)}
.lv-item .lbl{font-size:.9rem}
.lv-item .tag{font-size:.72rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.lv-item.sel .tag{background:var(--green);border-color:var(--green);color:#fff}
.lv-item .tag.prev{background:var(--orange-soft);border-color:#F1CDAE;color:var(--orange-ink)}
.selected-lv{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding:12px 14px;background:var(--paper);border-radius:12px}
.selected-lv .big{font-size:2rem;font-weight:700;color:var(--green-ink)}
.errs{margin-top:18px}
.errs .t{font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:.88rem;min-height:40px}
.chip.on{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-ink);font-weight:500}
.skip{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.skip .t{font-weight:500}
.skip .s{font-size:.82rem;color:var(--mute)}
.range{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:10px}
.range input{width:100%;accent-color:var(--orange)}
.range .v{width:44px;height:44px;border-radius:12px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.q{margin-top:18px}
.q .qt{font-weight:500}
.q .qs{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute)}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);gap:12px}
.summary-row .k{color:var(--ink2)}
.summary-row .v{font-weight:700;text-align:right}
.lockcard{margin-top:16px;padding:16px;border-radius:12px;background:var(--violet-soft);color:var(--violet-ink)}
.lockcard .t{font-weight:700;margin-bottom:4px}
.lockcard ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}

/* assessment single view */
.alayout{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start;padding-bottom:90px}
.jump{position:sticky;top:72px;display:flex;flex-direction:column;gap:2px}
.jump-i{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;font-size:.88rem;color:var(--ink2);width:100%}
.jump-i:hover{background:var(--card)}
.jump-i .mk{width:20px;height:20px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:.72rem;flex:none}
.jump-i.ok .mk{background:var(--green);color:#fff}
.jump-i.todo .mk{background:var(--violet-soft);color:var(--violet-ink)}
.jump-i .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jump-i .lvv{font-weight:700;color:var(--green-ink);font-size:.8rem}
.aform{min-width:0}
.asec{scroll-margin-top:76px}
.asec.need{border-color:#C4B7E6}
.lvgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.lvbtn{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:1.05rem;color:var(--ink2)}
.lvbtn:hover{background:var(--paper)}
.lvbtn.prev{border:2px dashed var(--orange);color:var(--orange-ink)}
.lvbtn.sel{background:var(--green);border-color:var(--green);color:#fff}
.selected-lv.todo{background:var(--violet-soft)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:25}
.dock-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.dock-st b{color:var(--ink)}
@media(max-width:820px){.alayout{grid-template-columns:1fr}.jump{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}.jump-i{width:auto;flex:none;background:var(--card);border:1px solid var(--line)}.jump-i .tx{overflow:visible}.lvgrid{grid-template-columns:repeat(7,1fr);gap:4px}.lvbtn{min-height:40px;font-size:.95rem}}
/* ---------- report ---------- */
.rep-wrap{max-width:860px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:500;min-height:42px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .sp{flex:1}
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:32px 36px;position:relative}
.sheet + .sheet{margin-top:18px}
.sheet .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--green);padding-bottom:12px;margin-bottom:20px;flex-wrap:wrap}
.sheet .rh h1{font-size:1.45rem}
.sheet .rh .m{font-size:.85rem;color:var(--ink2);text-align:right;line-height:1.5}
.sheet h2{font-size:1.05rem;display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.sheet h2 .pg{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:.85rem;display:grid;place-items:center}
.sheet .lead{font-size:.95rem;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.two{grid-template-columns:1fr}.sheet{padding:22px 18px}}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box.g{background:var(--green-soft);border-color:#B9D8CF}
.box.o{background:var(--orange-soft);border-color:#F1CDAE}
.box.v{background:var(--violet-soft);border-color:#C4B7E6}
.box .bt{font-weight:700;margin-bottom:6px}
.box ul{margin:0;padding-left:18px;font-size:.9rem}
.box li{margin:3px 0}
.delta-table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
.delta-table th{text-align:left;font-weight:500;color:var(--mute);font-size:.8rem;padding:6px 8px;border-bottom:1px solid var(--line)}
.delta-table td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.delta-table td.num{font-weight:700;font-size:1.1rem;text-align:center;white-space:nowrap}
.delta-table td.arrow{color:var(--mute);text-align:center}
.delta-table tr.locked td{color:var(--mute)}
.pill-list{display:flex;flex-wrap:wrap;gap:8px}
.pill{border-radius:999px;padding:5px 12px;font-size:.85rem;border:1px solid var(--line);background:#fff}
.pill.gone{text-decoration:line-through;color:var(--mute);background:var(--paper)}
.pill.stay{background:var(--orange-soft);border-color:#F1CDAE;color:var(--orange-ink)}
.pill.new{background:var(--red-soft);border-color:#EFC1BB;color:#7B2C25}
.coach-note{background:var(--paper);border-radius:12px;padding:14px 16px;font-size:.9rem}
.flag{display:inline-flex;align-items:center;gap:8px;background:var(--red-soft);color:#7B2C25;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line2);font-size:.75rem;color:var(--mute);display:flex;justify-content:space-between}
.tl-mini{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--ink2);flex-wrap:wrap}
.tl-mini span{background:var(--paper);border-radius:8px;padding:6px 10px}
.tl-mini span.now{background:var(--green-soft);color:var(--green-ink);font-weight:700}
.tl-mini .ar{color:var(--mute)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.demo-tip{position:fixed;right:16px;bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.78rem;color:var(--ink2);max-width:260px;z-index:30;box-shadow:0 6px 24px rgba(30,43,39,.08)}
.demo-tip b{display:block;color:var(--ink)}
@media(max-width:640px){.demo-tip{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.topbar,.tabs,.demo-tip,.toast,.dock{display:none}.sheet{border:0;padding:0;page-break-after:always}.main{padding:0}}

const monthsSince=d=>daysBetween(d,TODAY)/30.4;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stateOf(c){
  const d=draftOf(c.id), l=latestDone(c.id);
  if(d) return {k:'draft',cls:'violet',lbl:`アセスメント入力中（${filledCount(d)}/${totalCount(d)}）`,cta:'入力を続ける',order:0,href:`#assess/${c.id}/${d.id}`};
  if(!l) return {k:'first',cls:'gray',lbl:'初回アセスメント未実施',cta:'初回アセスメントを始める',order:1,href:`#assess/${c.id}/new`};
  const due=addM(l.date,3), left=daysBetween(TODAY,due);

}

/* =========================================================
   レーダー（5軸固定。未開放軸は点線表示）
   ========================================================= */
function radar(lv,prev,size=220){
  const cx=size/2,cy=size/2,R=size/2-34,N=5;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,v)=>[cx+R*(v/20)*Math.cos(ang(i)),cy+R*(v/20)*Math.sin(ang(i))];
  let s=`<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;display:block;margin:auto">`;
  [5,10,15,20].forEach(g=>{s+=`<polygon points="${AX.map((a,i)=>pt(i,g).join(',')).join(' ')}" fill="none" stroke="#E4EAE7" stroke-width="1"/>`});
  AX.forEach((a,i)=>{const [x,y]=pt(i,20);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${(a.core||isSet(lv[a.k]))?'#D9E1DD':'#C4B7E6'}" stroke-width="1" ${(a.core||isSet(lv[a.k]))?'':'stroke-dasharray="3 3"'}/>`});
  if(prev){s+=`<polygon points="${AX.map((a,i)=>pt(i,prev[a.k]||0).join(',')).join(' ')}" fill="#B9D8CF" fill-opacity=".45" stroke="#8FBFB0" stroke-width="1.5" stroke-dasharray="4 3"/>`}
  s+=`<polygon points="${AX.map((a,i)=>pt(i,lv[a.k]||0).join(',')).join(' ')}" fill="#2F7D6E" fill-opacity=".28" stroke="#2F7D6E" stroke-width="2.2" stroke-linejoin="round"/>`;
  AX.forEach((a,i)=>{const v=lv[a.k]||0;if(isSet(lv[a.k])){const [x,y]=pt(i,v);s+=`<circle cx="${x}" cy="${y}" r="4" fill="#2F7D6E"/>`}});
  AX.forEach((a,i)=>{const [x,y]=pt(i,20);const dx=Math.cos(ang(i)),dy=Math.sin(ang(i));
    const lx=x+dx*18,ly=y+dy*16;const anchor=Math.abs(dx)<.3?'middle':dx>0?'start':'end';
    s+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="10.5" font-weight="700" fill="${(a.core||isSet(lv[a.k]))?'#1E2B27':'#8B7CB3'}">${a.ic} ${a.ex}</text>`;
    if(!a.core&&!isSet(lv[a.k]))s+=`<text x="${lx}" y="${ly+17}" text-anchor="${anchor}" font-size="9" fill="#8B7CB3">半年目以降</text>`});
  return s+'</svg>';
}

/* =========================================================
   ルールベース（簡略）：優先テーマ／戦略
   ========================================================= */
function analyze(a){
  const done=CORE.concat(a.unlockExt?EXT:[]).filter(k=>isSet(a.lv[k]));
  const sorted=[...done].sort((x,y)=>a.lv[x]-a.lv[y]);
  if(!sorted.length) return {done,prio:[],strengths:[],low:'post'};
  const n=Math.min(3,Math.max(1,sorted.length-1));
  const prio=sorted.slice(0,n), strengths=sorted.slice(n).reverse();
  return {done,prio,strengths,low:sorted[0]};
}
function strategyHTML(a){
  const {prio}=analyze(a);
  const cls=['','two','three'];
  return prio.map((k,i)=>{const ax=A(k),lv=a.lv[k],b=bandOf(k,Math.max(1,lv)),top=nextBandTop(k,Math.max(1,lv));
   const nextLv=Math.min(20,lv+1);
   return `<div class="theme"><div class="num ${cls[i]}">${i+1}</div><div style="flex:1">
    <div class="ttl">${ax.pn}<span class="muted small">　${ax.ex}・Lv${lv}</span></div>
    <div class="next">いまの帯：<b>${lv?b.nm:'導入前'}</b>${lv?`（〜Lv${top}）`:''}　→ 次に狙う：<b>Lv${nextLv}</b> ${esc(ax.lt[nextLv-1]||'')}</div>
    ${(a.errs[k]||[]).length?`<div class="watch">前回見えたつまずき：<b>${a.errs[k].join('・')}</b>　→ レッスンではここを先に減らす</div>`:''}
   </div></div>`}).join('');
}

let W=null; /* 作業中の下書き（画面内状態） */
function initWizard(cid,aid){
  const c=CHILDREN.find(x=>x.id===cid);
  if(aid==='new'){
    const l=latestDone(cid);
    W={id:'new',child:cid,no:byChild(cid).length+1,date:fmt(TODAY),status:'draft',prev:l?l.id:null,unlockExt:!!c.ext,
       lv:{post:null,eyeh:null,hand:null,sacc:null,inhi:null},errs:{},troubles:l?[...l.troubles]:[],ppi:{time:0,emo:0,soc:0,fut:0,nav:0},ppiNote:'',plan:l?l.plan:(c.set==='pre'?'pre':'base'),esc:false,memo:'',goals:[...c.goals],open:{}};
  }else{const a=ASSESS.find(x=>x.id===aid);W=JSON.parse(JSON.stringify(a));W.goals=[...c.goals];W.lv={sacc:null,inhi:null,...W.lv};W.open={};}
}
const measKeys=()=>CORE.concat(W.unlockExt?EXT:[]);
function viewAssess(cid,aid){
  const c=CHILDREN.find(x=>x.id===cid); if(!c) return viewHome();

  /* 左のジャンプナビ（入力状態つき） */
  const secs=[{id:'s-base',t:'基本情報',ok:true},
    ...meas.map(k=>({id:'s-'+k,t:`${A(k).ic} ${A(k).ex}`,ok:isSet(W.lv[k]),lv:W.lv[k]})),
    {id:'s-trouble',t:'お困りごと',ok:W.troubles.length>0,soft:true},
    {id:'s-ppi',t:'ご家庭の負担度',ok:ppiDone,soft:true},
    {id:'s-memo',t:'計画・所見・引き継ぎ',ok:!!W.plan,soft:true}];
  const navHTML=`<div class="jump">${secs.map(x=>`<button class="jump-i ${x.ok?'ok':x.soft?'':'todo'}" onclick="document.getElementById('${x.id}').scrollIntoView({behavior:'smooth',block:'start'})"><span class="mk">${x.ok?'✓':'・'}</span><span class="tx">${x.t}</span>${isSet(x.lv)?`<span class="lvv">Lv${x.lv}</span>`:''}</button>`).join('')}</div>`;

  /* --- 基本情報 --- */
  const base=`<div class="panel asec" id="s-base"><div class="panel-h"><h2>基本情報</h2><span class="autosave"><i></i>自動保存 14:32</span></div>

    ${c.ext?`<label class="check violet on" style="margin-top:14px"><input type="checkbox" checked disabled><div><div class="t">🔓 4・5種目目（あしあとものまね／信号ゲーム）は開放済み</div><div class="s">一度開放すると、以降のアセスメントではずっと有効です。</div></div></label>`
     :`<label class="check violet ${W.unlockExt?'on':''}" style="margin-top:14px"><input type="checkbox" ${W.unlockExt?'checked':''} onchange="W.unlockExt=this.checked;render()"><div><div class="t">🔓 4・5種目目を開放する（あしあとものまね／信号ゲーム）</div><div class="s">入会から${Math.floor(months)}か月。目安は半年目以降ですが、開放するかはコーチの判断です（土台が安定してから）。一度開放すると以降ずっと有効になり、元には戻せません。</div></div></label>`}

  /* --- 種目 --- */

    const grid=`<div class="lvgrid">${Array.from({length:21},(_,n)=>`<button class="lvbtn ${lv===n?'sel':''} ${plv===n?'prev':''}" onclick="setLv('${k}',${n})" title="${n?esc(ax.lt[n-1]):LV0}">${n}</button>`).join('')}</div>`;

    const ladder=open?`<div class="lv-list" style="max-height:none;margin-top:10px"><div class="band-h">未到達</div><button class="lv-item ${lv===0?'sel':''}" onclick="setLv('${k}',0)"><span class="no">Lv0</span><span class="lbl">${LV0}</span><span>${plv===0?'<span class="tag prev">前回</span>':''}</span></button>${ax.lt.map((t,j)=>{const n=j+1,b=ax.bands.find(x=>n<=x.to),bh=(j===0||ax.bands.find(x=>j<=x.to)!==b)?`<div class="band-h">帯：${b.nm}（〜Lv${b.to}）</div>`:'';return bh+`<button class="lv-item ${lv===n?'sel':''}" onclick="setLv('${k}',${n})"><span class="no">Lv${n}</span><span class="lbl">${esc(t)}</span><span>${plv===n?'<span class="tag prev">前回</span>':''}</span></button>`}).join('')}</div>`:'';
    return `<div class="panel asec ${isSet(lv)?'':'need'}" id="s-${k}"><div class="panel-h"><div class="exlabel" style="margin:0"><span class="ic">${ax.ic}</span><div><h2>${ax.ex}</h2><div class="small muted">${ax.pn}　—　${ax.nm}</div></div></div><span class="r">${isSet(lv)?'':'<span class="status violet">未入力</span>'}</span></div>
     ${grid}${sel}
     <button class="btn ghost" style="min-height:36px;padding:4px 10px;margin-top:8px" onclick="W.open['${k}']=!W.open['${k}'];render()">${open?'ラダーの一覧を閉じる':'ラダーの一覧（各Lvの課題）を見る'}</button>${ladder}
     <div class="errs"><div class="t small">見えたつまずき（あれば）</div><div class="chips">${ax.errs.map(e=>`<button class="chip ${(W.errs[k]||[]).includes(e)?'on':''}" onclick="togErr('${k}','${e}')">${e}</button>`).join('')}</div></div>
    </div>`};

  /* --- 困りごと --- */
  const cats=CATSET[c.set];
  const trouble=`<div class="panel asec" id="s-trouble"><div class="panel-h"><h2>お子さまのお困りごと</h2><span class="r">保護者に聞き取り${prev?'・前回の項目は入った状態':''}</span></div>
    <div class="two">${cats.map(cat=>`<div><div class="section-title" style="margin:0 0 8px">${cat.ic} ${cat.ttl}</div>${cat.items.map(t=>`<label class="check ${W.troubles.includes(t)?'on':''}"><input type="checkbox" ${W.troubles.includes(t)?'checked':''} onchange="togTrouble('${esc(t)}')"><div class="t small">${esc(t)}${prev&&prev.troubles.includes(t)?'<span class="tag prev" style="margin-left:6px;font-size:.7rem;border-radius:999px;padding:1px 7px;background:var(--orange-soft);color:var(--orange-ink)">前回も</span>':''}</div></label>`).join('')}</div>`).join('')}</div></div>`;

  /* --- 家庭負担 --- */
  const ppi=`<div class="panel asec" id="s-ppi"><div class="panel-h"><h2>ご家庭のお困り度</h2><span class="r">0〜5・3か月後に同じ設問で測り直す</span></div>
    ${PPI.map(p=>`<div class="q" style="margin-top:10px"><div class="qt small">${p.q}${prev?`<span class="muted">　（前回 ${prev.ppi[p.k]}）</span>`:''}</div><div class="range"><div><input type="range" min="0" max="5" value="${W.ppi[p.k]||0}" oninput="W.ppi['${p.k}']=+this.value;this.closest('.range').querySelector('.v').textContent=this.value"><div class="qs"><span>ほぼ感じない</span><span>とても大きい</span></div></div><div class="v">${W.ppi[p.k]||0}</div></div></div>`).join('')}

  /* --- 下部固定バー --- */

    <div style="display:flex;gap:10px;flex:none"><span class="btn" role="link" tabindex="0" onclick="go('#child/${cid}')">いったん閉じる</span><button class="btn primary" onclick="finishWizard()" ${missing.length?'disabled':''}>レポートを作る</button></div></div></div>`;

    `<div class="alayout">${navHTML}<div class="aform">${base}${meas.map(evSec).join('')}${trouble}${ppi}${memo}</div></div>${bar}`);

function setLv(k,n){W.lv[k]=n;toast('保存しました');render();}

function finishWizard(){

     <div class="box"><p class="small">${prev?`「${esc(stay[0]||a.troubles[0]||'')}」は続いていますが、土台になる<b>${A(low).pn}</b>が Lv${prev.lv[low]}→Lv${a.lv[low]} と上がっており、方向は合っています。次の3か月も同じ土台を積み上げます。`:`チェックされた困りごとの多くは、<b>${A(low).pn}</b>（${A(low).ex} Lv${a.lv[low]}）がまだ育っている途中であることと一致しています。${A(low).grow}`}</p></div>
     <h2><span class="pg">3</span>ご家庭の負担度${prev?`　<span class="muted" style="font-weight:400;font-size:.9rem">${ppiSum(prev.ppi)} → ${ppiSum(a.ppi)}（25点満点）</span>`:''}</h2>
     <div class="bar-ppi">${PPI.map(p=>`<div class="ppi"><span>${p.nm}</span><span class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=(a.ppi[p.k]||0)?'on':prev&&i<=(prev.ppi[p.k]||0)?'was':''}"></i>`).join('')}</span><span class="n">${a.ppi[p.k]}${prev?`<span class="muted small">/${prev.ppi[p.k]}</span>`:''}</span></div>`).join('')}</div>
     ${a.ppiNote?`<p class="small" style="margin-top:10px">いちばん負担に感じている場面：「${esc(a.ppiNote)}」</p>`:''}
     <div class="foot"><span>へやすぽアシスト</span><span>Page 2</span></div></div>`;
    const plan=a.plan?PLANS[a.plan]:null;
    const sec3=`<div class="sheet"><div class="rh"><div><h1>これからの3か月</h1></div></div>
     ${plan?`<div class="box g"><div class="bt">📋 ${plan.nm}（${plan.w}）</div><ul>${plan.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`:''}
     <h2><span class="pg">1</span>レッスンで育てること</h2>
     <div class="two">${prio.map(k=>`<div class="box"><div class="bt">${A(k).ic} ${A(k).pn}</div><ul>${A(k).build.map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join('')}</div>
     <h2><span class="pg">2</span>3か月後にこう変わるはず</h2>
     <div class="box o"><ul>${prio.slice(0,2).flatMap(k=>A(k).chg3).map(t=>`<li>${t}</li>`).join('')}</ul></div>
     <div class="tl-mini" style="margin-top:18px"><span>${prev?`${prev.no}回目 ${fmtMD(prev.date)}`:'入会'}</span><span class="ar">→</span><span class="now">今回 ${fmtMD(a.date)}</span><span class="ar">→</span><span>次回 ${fmtMD(addM(a.date,3))} ごろ</span>${!a.unlockExt&&monthsSince(c.joined)+3>=6?`<span class="ar">→</span><span style="background:var(--violet-soft);color:var(--violet-ink)">🔓 半年目以降、4・5種目目を追加</span>`:''}</div>
     <div class="foot"><span>へやすぽアシスト</span><span>Page 3</span></div></div>`;
    return sec1+sec2+sec3;
  };
  return frame([{t:'担当の子ども',href:'#home'},{t:c.name+hon,href:`#child/${c.id}`},{t:`${a.no}回目レポート`}],`<div class="rep-wrap">
    <div class="tabs"><span class="small muted">親御さん向けレポート（コーチ用の内容は子どもページで確認できます）</span><span class="sp"></span>
     <button class="btn" onclick="window.print()">印刷 / PDF</button><button class="btn ${a.shared?'':'primary'}" onclick="ASSESS.find(x=>x.id==='${a.id}').shared=true;toast('共有済みにしました');render()">${a.shared?'✓ 保護者に共有済み':'保護者に共有した'}</button></div>
    ${parent()}</div>`);
}
/* コーチ用シート（引き継ぎPDFの1回分） */
function coachSheet(aid){
  const a=ASSESS.find(x=>x.id===aid), c=CHILDREN.find(x=>x.id===a.child), prev=a.prev?ASSESS.find(x=>x.id===a.prev):null, hon=c.hon;
  const dtable=deltaTable(a,prev);
  return `<div class="sheet"><div class="rh"><div><h1>コーチ用シート</h1><p class="small muted">${c.name}${hon}　${a.no}回目　${fmt(a.date)}</p></div>${a.esc?`<span class="flag">⚑ SVへ引き継ぎ（山口SV）</span>`:''}</div>
    <h2><span class="pg">1</span>優先テーマと次に狙うレベル</h2>
    <div class="strategy">${strategyHTML(a)}</div>
    <h2><span class="pg">2</span>各種目の到達と、見えたつまずき</h2>${dtable}
    <div class="two" style="margin-top:12px">${AX.map(x=>x.k).filter(k=>(a.errs[k]||[]).length).map(k=>`<div class="box o"><div class="bt">${A(k).ic} ${A(k).ex}</div><ul>${a.errs[k].map(e=>`<li>${e}</li>`).join('')}</ul></div>`).join('')}</div>
    ${prev?`<h2><span class="pg">3</span>前回からの変化（内部メモ）</h2><div class="coach-note">前回所見：${esc(prev.memo)}</div>`:''}
    <h2><span class="pg">${prev?4:3}</span>今回の所見</h2><div class="coach-note">${a.memo?esc(a.memo):'<span class="muted">（記入なし）</span>'}</div>
    ${!a.unlockExt?`<div class="box v" style="margin-top:16px"><div class="bt">🔒 未開放：${EXT.map(k=>A(k).ex).join('・')}</div><p class="small">次回のアセスメント準備画面で「4・5種目目を開放する」にチェックすると測定できます。表示上の目安は入会半年以降ですが、有効化はコーチの判断です。一度開放すると以降ずっと有効になります。開放するまでは診断アルゴリズムに入りません。</p></div>`:''}
    ${a.troubles.length?`<h2><span class="pg">${prev?5:4}</span>お困りごと・ご家庭の負担度</h2><div class="pill-list">${a.troubles.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><p class="small muted" style="margin-top:8px">負担度 合計 ${PPI.reduce((s,p)=>s+(a.ppi[p.k]||0),0)}/25${a.ppiNote?`　「${esc(a.ppiNote)}」`:''}</p>`:''}
    <div class="foot"><span>へやすぽアシスト</span><span>${c.name}${hon}　${a.no}回目　コーチ用（内部）</span></div></div>`;
}
/* 引き継ぎ用：過去のアセスメントをまとめてPDFに */
function viewHandover(cid){
  const c=CHILDREN.find(x=>x.id===cid); if(!c) return viewHome();
  const list=byChild(cid).filter(a=>a.status==='done');
  setTip('代行レッスン・コーチ交代のための内部資料。過去回すべてのコーチ用シートを1つのPDFに。','⑥ 引き継ぎ用PDF');
  return frame([{t:'担当の子ども',href:'#home'},{t:c.name+c.hon,href:`#child/${cid}`},{t:'引き継ぎ用シート'}],`<div class="rep-wrap">
    <div class="tabs"><div><b>${c.name}${c.hon}　引き継ぎ用シート</b><div class="small muted">アセスメント ${list.length}回分・コーチ内部用。保護者には渡さないでください。</div></div><span class="sp"></span><button class="btn primary" onclick="window.print()">PDFに書き出す</button></div>
    <div class="sheet"><div class="rh"><div><h1>${c.name}${c.hon}（${c.age}歳・${c.grade}）</h1><p class="small muted">入会 ${fmt(c.joined)}　出力日 ${fmt(TODAY)}　出力者 ${COACH.name}</p></div>${c.ext?'<span class="status violet">🔓 4・5種目目 開放済み</span>':''}</div>
     <div class="goals">${c.goals.map(g=>`<span>🎯 ${esc(g)}</span>`).join('')}</div>
     <h2><span class="pg">＝</span>到達レベルの推移</h2>
     <table class="delta-table"><tr><th>種目</th>${list.map(a=>`<th style="text-align:center">${a.no}回目<br>${fmtMD(a.date)}</th>`).join('')}</tr>
      ${AX.map(ax=>`<tr><td>${ax.ic} ${ax.ex}</td>${list.map(a=>`<td class="num">${isSet(a.lv[ax.k])?'Lv'+a.lv[ax.k]:'<span class="small muted" style="font-weight:400">—</span>'}</td>`).join('')}</tr>`).join('')}
      <tr><td>困りごと（件）</td>${list.map(a=>`<td class="num">${a.troubles.length}</td>`).join('')}</tr>
      <tr><td>ご家庭の負担度（/25）</td>${list.map(a=>`<td class="num">${PPI.reduce((s,p)=>s+(a.ppi[p.k]||0),0)}</td>`).join('')}</tr></table>
     ${list.some(a=>a.esc)?`<div style="margin-top:14px"><span class="flag">⚑ SV引き継ぎあり（${list.filter(a=>a.esc).map(a=>a.no+'回目').join('・')}）</span></div>`:''}
    </div>
    ${list.slice().reverse().map(a=>coachSheet(a.id)).join('')}
    ${list.length?'':'<div class="sheet"><p class="muted">完了したアセスメントがまだありません。</p></div>'}
  </div>`);
}

/* =========================================================
   router
   ========================================================= */
let ROUTE=location.hash||'#login';
function go(h){ROUTE=h;try{history.replaceState(null,'',h)}catch(e){}render();return false;}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='link')e.target.click()});
function render(){
  const h=ROUTE, p=h.slice(1).split('/');
  let html;
  if(p[0]==='home')html=viewHome();
  else if(p[0]==='child')html=viewChild(p[1]);
  else if(p[0]==='assess')html=viewAssess(p[1],p[2]);
  else if(p[0]==='report')html=viewReport(p[1]);
  else if(p[0]==='handover')html=viewHandover(p[1]);
  else html=viewLogin();
  const y=window.scrollY, same=p[0]==='assess'&&render.last===h;
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,same?y:0); render.last=h;
}
window.addEventListener('hashchange',()=>{if(location.hash&&location.hash!==ROUTE)go(location.hash)});
render();
</script>
